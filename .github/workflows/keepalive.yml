name: Keep Double Live awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 5 \
            https://double-live-radar-eu.onrender.com/health
